<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/icon.ico" type="image/x-icon">
    <title>Império Fitness</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <style>


    :root {
        --cor-principal: #ecd071; /* Cor principal do site */
        --cor-hover:#e1aa1e;/*cor hover site secundária*/
    }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            padding-top: 70px;
        }

        .header {
    cursor: pointer;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background-color: #1e1e1e;
    padding: 20px 0;
    display: flex; /* Define o layout como flexbox */
    justify-content: center; /* Centraliza horizontalmente */
    align-items: center; /* Centraliza verticalmente */
    text-align: center;
    z-index: 1000;
}

        .header h1 {
    color: #ecd071; /* Cor do texto */
    margin: 0; /* Remove margens */
    font-size: 30px; /* Tamanho do texto */
    font-family: 'Arial', sans-serif; /* Fonte personalizada */
    display: flex; /* Flexbox para alinhar o texto e a imagem */
    align-items: center; /* Alinha verticalmente o texto e a imagem */
    gap: 10px; /* Espaçamento entre o texto e a imagem */
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2); /* Sombra no texto */
    transition: transform 0.3s ease, color 0.3s ease; /* Transições suaves */
}

.header h1:hover {
    transform: scale(1.1); /* Ampliação suave no hover */
    color: #d2b860; /* Cor do texto no hover */
}

.header-img {
    width: 60px; /* Tamanho da imagem */
    height: 60px; /* Tamanho proporcional */
    /* Deixa a imagem circular */
    transition: transform 0.3s ease; /* Efeito suave na imagem */
}



        .container {
            margin-top: 40px;
            display: flex;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.19), 0 6px 6px rgba(0, 0, 0, 0.23);
            width: 90%;
            max-width: 900px;
            gap: 30px;
        }

        .audio-video-section {
            display: flex;
            width: 100%;
            gap: 30px;
        }

        .left-column,
        .right-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .audio-box {
            background-color: #2c2c2c;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .timer-display {
            font-size: 3em;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            color: #ecd071;
        }

        .audio-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--cor-principal);
        }

        .audio-player {
            width: 100%;
            margin-bottom: 20px;
        }

        #savedTextsList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
        }

        #savedTextsList li span {
            cursor: pointer;
            flex-grow: 1;
        }

        .delete-text {
            background-color: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            padding: 0 5px;
        }

        .delete-text:hover {
            color: var(--cor-principal);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #BBBBBB;
        }

        input[type="number"],
        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: none;
            background-color: #3c3c3c;
            color: #ffffff;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        input[type="number"] {
            width: 60px;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        button {
            background-color: var(--cor-principal);
            color: black;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--cor-hover);
        }

        #youtubePlayer {
            width: 100%;
            height: 315px;
            margin-top: -20px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        #youtubeOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 165, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
        }

        .sound-wave {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .sound-wave span {
            width: 10px;
            background-color: var(--cor-principal);
            animation: sound-wave 1.5s infinite ease-in-out;
        }

        .sound-wave span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .sound-wave span:nth-child(3) {
            animation-delay: 0.4s;
        }

        .sound-wave span:nth-child(4) {
            animation-delay: 0.6s;
        }

        .sound-wave span:nth-child(5) {
            animation-delay: 0.8s;
        }

        @keyframes sound-wave {

            0%,
            100% {
                height: 10px;
            }

            50% {
                height: 100px;
            }
        }

        #errorMessage {
            color: var(--cor-principal);
            margin-top: 10px;
            text-align: center;
        }

        .Custom-audio-section-title {
            color: var(--cor-principal);
            font-size: 1.5em;
            margin-bottom: 15px;
            text-align: center;
        }

        #customAudiosSection {
            margin-top: 5px;
            margin-bottom: 60px;
            width: 90%;
            max-width: 900px;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.19), 0 6px 6px rgba(0, 0, 0, 0.23);
        }

        #customAudiosSection .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background-color: #2c2c2c;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            margin: 0 auto;
        }

        #customAudiosSection .input-group input[type="text"],
        #customAudiosSection .input-group input[type="file"] {
            width: 100%;
            max-width: 300px;
        }

        #customAudiosSection .input-group button {
            width: 100%;
            max-width: 300px;
        }

        #customAudiosList {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            justify-content: center;
        }

        .custom-audio-box {
            align-items: center;
            display: grid;
            justify-content: center;
            background-color: #2c2c2c;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .custom-audio-title {
            justify-content: center;
            align-items: center;
            display: flex;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--cor-principal);
        }

        .custom-audio-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        .delete-audio {
            background-color: var(--cor-principal);
        }

        .delete-audio:hover {
            background-color: var(--cor-hover);
        }

        #textToSpeechSection {
            margin-top: 30px;
            margin-bottom: 40px;
            width: 90%;
            max-width: 900px;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.19), 0 6px 6px rgba(0, 0, 0, 0.23);
        }

        .input-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        #textToSpeechSection h2 {
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--cor-principal);
            margin-bottom: 20px;
        }

        #text-input {
            width: 750px;
            max-width: 900px;
            height: 100px;
            padding: 10px;
            font-size: 16px;
            border: aliceblue;
            background-color: #3c3c3c;
            color: #ffffff;
            border-radius: 5px;
            resize: inline;
        }

        #textToSpeechSection button {
            color: black;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-right: 10px;
        }

        #textToSpeechSection .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        #textToSpeechSection audio {
            flex: 1;
            height: 40px;
            max-width: 250px;
        }

        #savedTextsSection {
            margin-top: 20px;
            background-color: #2c2c2c;
            border-radius: 10px;
            padding: 20px;
            display: none;
        }

        #savedTextsList {
            list-style-type: none;
            padding: 0;
        }

        #savedTextsList li {
            background-color: #3c3c3c;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        #savedTextsList li:hover {
            background-color: #4c4c4c;
        }

        footer {
            background-color: #1e1e1e;
            color: #ffffff;
            text-align: center;
            padding: 40px 0;
            width: 100%;
            position: relative;
            bottom: 0;
            left: 0;
            overflow: hidden;
        }

        footer p {
            color: var(--cor-principal);
            margin: 0;
            transition: transform 0.3s ease;
            cursor: pointer;
            display: inline-block;
        }

        footer p:hover {
            transform: scale(1.04);
            transform-origin: center;
        }

        /* Novos estilos para a barra lateral e botão de últimos vídeos */
        .sidebar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background-color: #1e1e1e;
            transition: right 0.3s ease-in-out;
            overflow-y: auto;
            z-index: 1001;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            padding: 20px;
            background-color: #2c2c2c;
            color: var(--cor-principal);
            font-size: 1.2em;
            font-weight: bold;
        }

        .sidebar-close {
            float: right;
            cursor: pointer;
        }

        .video-list {
            padding: 10px;
        }

        .video-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .video-item:hover {
            background-color: #2c2c2c;
        }

        .video-thumbnail {
            width: 120px;
            height: 67px;
            margin-right: 10px;
            object-fit: cover;
            border-radius: 3px;
        }

        .video-title {
            flex: 1;
            font-size: 0.9em;
            color: #ffffff;
        }

        .youtube-controls {
            display: flex;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .audio-video-section {
                flex-direction: column;
            }

            .header h1 {
                font-size: 25px;
            }

            .left-column,
            .right-column {
                width: 100%;
            }

            #youtubePlayer {
                height: 200px;
            }

            #customAudiosList {
                grid-template-columns: 1fr;
            }

            #textToSpeechSection .controls {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                padding: 5px;
            }

            #textToSpeechSection audio {
                max-width: 100%;
            }

            #customAudiosSection .input-group {
                padding: 15px;
            }

            #customAudiosSection .input-group input[type="text"],
            #customAudiosSection .input-group input[type="file"],
            #customAudiosSection .input-group button {
                max-width: 100%;
            }

            .sidebar {
                width: 100%;
                right: -100%;
            }

            .sidebar.open {
                right: 0;
            }

            .youtube-controls {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <h1>
            Academia Império Fitness
            <img src="imagens/Logo Site Império.png" alt="Logo da Academia" class="header-img">
        </h1>
    </header>
    
    

    <div class="container">
        <div class="audio-video-section">
            <!-- Coluna Esquerda: Áudios de Avisos -->
            <div class="left-column">
                <div class="audio-box">
                    <div class="timer-display" id="timer"></div>
                    <div class="audio-title">Aviso dos Pesos</div>
                    <audio id="audioPlayer" class="audio-player" controls>
                        <source src="audios/audio alunos imperio.mp3" type="audio/mpeg">
                        Seu navegador não suporta o elemento de áudio.
                    </audio>
                    <div class="input-group">
                        <label for="intervalInput">Intervalo de reprodução (minutos):</label>
                        <input type="number" id="intervalInput" min="1" value="2" step="1">
                        <button onclick="updateInterval()"><i class="fas fa-sync-alt"></i> Atualizar</button>
                    </div>
                </div>

                <div class="audio-box">
                    <div class="audio-title">Aviso, 10 minutos para Fechar Academia</div>
                    <audio id="audioPlayer2" class="audio-player" controls>
                        <source src="audios/encerramento das atividades.mp3" type="audio/mpeg">
                        Seu navegador não suporta o elemento de áudio.
                    </audio>
                </div>
            </div>

            <!-- Coluna Direita: Vídeo do YouTube -->
            <div class="right-column">
                <div class="input-group">
                    <label for="youtubeLink">Link do YouTube:</label>
                    <input type="text" id="youtubeLink" placeholder="Cole o link do YouTube aqui"
                        onclick="clearLinkField()">
                    <div class="youtube-controls">
                        <button onclick="loadYouTubeVideo()"><i class="fas fa-play"></i> Carregar Vídeo</button>
                        <button onclick="toggleSidebar()"><i class="fas fa-history"></i> Últimos Vídeos</button>
                    </div>
                </div>

                <div id="youtubePlayer">
                    <div id="youtubeOverlay">
                        <div class="sound-wave">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
                <div id="errorMessage"></div>
            </div>
        </div>
    </div>

    <!-- Nova seção de Texto para Áudio -->
    <div id="textToSpeechSection">
        <h2>Digite o texto para falar</h2>

        <!-- Nova div para centralizar o input -->
        <div class="input-container">
            <textarea id="text-input" placeholder="Digite o texto aqui..."></textarea>
        </div>

        <div class="controls">
            <button onclick="textToSpeech()"><i class="fas fa-volume-up"></i> Falar Texto</button>
            <button onclick="saveText()"><i class="fas fa-save"></i> Salvar Texto</button>
            <button onclick="toggleSavedTexts()"><i class="fas fa-list"></i> Textos Salvos</button>
            <audio id="audio-output" controls></audio>
        </div>

        <div id="savedTextsSection">
            <h3>Textos Salvos</h3>
            <ul id="savedTextsList"></ul>
        </div>
    </div>

    <!-- Seção Separada para Áudios Personalizados -->
    <div id="customAudiosSection">
        <h2 class="Custom-audio-section-title">Áudios Personalizados</h2>
        <div class="input-group">
            <label for="customAudioTitle">Título do Áudio:</label>
            <input type="text" id="customAudioTitle" placeholder="Digite o título do áudio">
            <label for="customAudioFile">Anexar Áudio:</label>
            <input type="file" id="customAudioFile" accept="audio/*">
            <button onclick="saveCustomAudio()"><i class="fas fa-plus"></i> Salvar Áudio</button>
        </div>
        <div id="customAudiosList"></div>
    </div>

    <!-- Nova barra lateral -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            Últimos Vídeos
            <span class="sidebar-close" onclick="toggleSidebar()">&times;</span>
        </div>
        <div class="video-list" id="videoList"></div>
    </div>

    <footer>
        <p>Desenvolvido Por © Genilson Ferreira</p>
    </footer>

    <script src="/script.js"></script>

    <!-- Scripts da API do YouTube -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
        window.ENV = {
            GOOGLE_API_KEY: 'AIzaSyDVAHSw4orD521_pSacG5y_bb8VyZRiNyI'
        };

        function initYouTubeAPI() {
            gapi.client.init({
                'apiKey': window.ENV.GOOGLE_API_KEY,
                'discoveryDocs': ['https://www.googleapis.com/discovery/v1/apis/youtube/v3/rest'],
            }).then(function () {
                console.log('YouTube API initialized');
            }, function (error) {
                console.error('Error initializing YouTube API', error);
            });
        }

        gapi.load('client', initYouTubeAPI);
    </script>
</body>

</html>
